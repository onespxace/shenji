name: Deploy AuditDesk Web to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Sync local OCR assets
        working-directory: web
        run: npm run sync:ocr

      # PaddleOCR 模型已随仓库入库（web/public/ocr/paddle/），这一步只是兜底自愈。
      # 刻意不阻断构建：2026-09-26 因为模型只能从外部 CDN 拉、runner 拉不到，
      # 导致 prebuild 失败、整站 9 分钟没更新。模型拉不到时工作台应回退
      # Tesseract，而不是把整站拖下线。
      - name: Ensure PaddleOCR models (non-blocking)
        working-directory: web
        run: npm run sync:paddle
        continue-on-error: true

      - name: Validate samples, Markdown and typography
        working-directory: web
        run: npm run validate:all

      - name: Build Vue site
        working-directory: web
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
