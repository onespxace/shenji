<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AuditDesk 桌面/移动断点审计（开发用，不进构建产物）</title>
<style>
  body { margin: 0; background: #1b2434; font-family: "Microsoft YaHei", sans-serif; color: #e6ecf7; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; }
  .device { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .device-label { padding: 5px 9px; color: #b9c6da; font-size: 11px; text-align: center; background: #26314a; }
  iframe { display: block; border: 0; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
// 审计目标：顶部导航在 1024 / 1280 / 1440 / 1920 下是否完整可见、有无溢出或换行；
// 移动端 390 / 430 / 560 / 768 / 820 下底部标签栏与栅格表现。
// 用 iframe 固定宽度渲染，与真机一致；不用 CSS 缩放，避免测量失真。
const SIZES = [
  { w: 1024, h: 800,  label: '桌面 1024' },
  { w: 1280, h: 860,  label: '桌面 1280' },
  { w: 1440, h: 900,  label: '桌面 1440' },
  { w: 1920, h: 1000, label: '桌面 1920' },
  { w: 820,  h: 900,  label: '平板 820' },
  { w: 768,  h: 900,  label: '平板 768' },
  { w: 560,  h: 820,  label: '小屏 560' },
  { w: 430,  h: 860,  label: '手机 430' },
  { w: 390,  h: 780,  label: '手机 390' }
]

const row = document.getElementById('row')
const frames = []
for (const size of SIZES) {
  const box = document.createElement('div')
  box.className = 'device'
  const label = document.createElement('div')
  label.className = 'device-label'
  label.textContent = `${size.label} · ${size.w}px`
  const frame = document.createElement('iframe')
  frame.width = size.w
  frame.height = size.h
  frame.src = '/'
  box.append(label, frame)
  row.append(box)
  frames.push({ frame, size })
}

// 关键测量：导航是否完整可见、是否换行、是否溢出、底部标签栏是否出现
function measure(frame, size) {
  const d = frame.contentDocument
  const w = frame.contentWindow
  if (!d || !d.body) return { size: size.label, error: 'not loaded' }
  const nav = d.querySelector('.top-nav')
  const items = [...d.querySelectorAll('.top-nav-item')]
  const tabbar = d.querySelector('.app-tabbar')
  const navRect = nav ? nav.getBoundingClientRect() : null
  const itemRects = items.map((el) => {
    const r = el.getBoundingClientRect()
    return { label: el.textContent.trim(), x: Math.round(r.x), w: Math.round(r.width), y: Math.round(r.y) }
  })
  // 换行检测：所有项 top 是否一致
  const tops = [...new Set(itemRects.map((r) => r.y))]
  const doc = d.documentElement
  return {
    size: size.label,
    vw: size.w,
    navPresent: !!nav,
    navVisible: navRect ? getComputedStyle(nav).display !== 'none' : false,
    navScrollW: nav ? nav.scrollWidth : null,
    navClientW: nav ? nav.clientWidth : null,
    navOverflowX: nav ? nav.scrollWidth > nav.clientWidth + 1 : null,
    navRight: navRect ? Math.round(navRect.right) : null,
    itemCount: items.length,
    itemRows: tops.length,
    wrapped: tops.length > 1,
    lastItemRight: itemRects.length ? Math.max(...itemRects.map((r) => r.x + r.w)) : null,
    lastItemLabel: itemRects.length ? itemRects[itemRects.length - 1].label : null,
    // 顶栏右侧操作区是否被挤出
    actionsRight: (() => { const a = d.querySelector('.topbar-actions'); return a ? Math.round(a.getBoundingClientRect().right) : null })(),
    tabbarVisible: tabbar ? getComputedStyle(tabbar).display !== 'none' : false,
    horizontalScroll: doc.scrollWidth > doc.clientWidth + 1 ? doc.scrollWidth : false,
    bodyScrollW: doc.scrollWidth
  }
}

window.__audit = () => frames.map(({ frame, size }) => measure(frame, size))
window.__ready = new Promise((resolve) => {
  let n = 0
  const timer = setInterval(() => {
    n += 1
    const all = frames.every(({ frame }) => frame.contentDocument && frame.contentDocument.querySelector('.top-nav'))
    if (all || n > 60) { clearInterval(timer); resolve(frames.length) }
  }, 250)
})
</script>
</body>
</html>
