<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>路由行为验证（开发用，不进构建产物）</title>
<style>
  body { margin: 0; padding: 18px; background: #f6f8fb; font: 14px/1.7 "Microsoft YaHei", sans-serif; color: #1f2937; }
  h1 { font-size: 1.1rem; margin: 0 0 12px; }
  #out div { font: 13px/1.7 ui-monospace, monospace; }
  .PASS { color: #047857; } .FAIL { color: #b91c1c; } .h { font-weight: 700; margin-top: 10px; }
  iframe { width: 1280px; height: 620px; border: 1px solid #cbd5e1; border-radius: 8px; }
</style>
</head>
<body>
<h1>路由行为验证</h1>
<div id="out">等待…</div>
<script type="module">
// 验证三条只能靠真实浏览器证明的硬要求：
//   1. 刷新后保留当前页面
//   2. 浏览器后退 / 前进可用
//   3. navigate API 兼容（inject('navigate') 仍能切视图）
// 纯逻辑部分（hash 解析、路由表）由 validate-router.mjs 覆盖。
const out = document.getElementById('out')
const lines = []
const log = (t, cls = '') => { lines.push([t, cls]); out.innerHTML = lines.map(([x, c]) => `<div class="${c}">${x}</div>`).join('') }
const results = []
const check = (name, ok, detail = '') => { results.push({ name, ok, detail }); log(`${ok ? 'PASS' : 'FAIL'} ${name}${detail && !ok ? ' · ' + detail : ''}`, ok ? 'PASS' : 'FAIL') }

// 被测入口。默认同源的 probe-index.html（dist 里同一份产物去掉 modulepreload 提示），
// 这样探针跟着 preview 端口走，不必硬编码 dev server 地址。
// 用 ?base=/ 可强制测真实入口。
const CB = new URLSearchParams(location.search).get('cb') || ''
const RAW_BASE = new URLSearchParams(location.search).get('base') || '/probe-index.html'
const BASE = /^https?:/.test(RAW_BASE) ? RAW_BASE : RAW_BASE + (CB ? `?cb=${CB}` : '')
const frame = document.createElement('iframe')
frame.src = BASE
/**
 * 必须等 iframe 的 load 事件，不能在"导航项一出现"就操作。
 *
 * 这是"后退回到上一个视图"偶发失败的真正原因（不是路由坏了）：
 * Vue 首次渲染比 iframe 的 load 早，如果在这之前就改 hash，
 * 这次 hash 变更会和 iframe 的**初始导航**合并成同一条历史记录，
 * 于是 history.length 停在 1、"后退"无处可去。
 * 症状是"页面明明切过去了，后退却没反应"，很容易误判成路由 bug。
 */
const frameLoaded = new Promise((resolve) => {
  frame.addEventListener('load', resolve, { once: true })
  setTimeout(resolve, 10000)
})
document.body.appendChild(frame)
frameLoaded.then(() => new Promise((r) => setTimeout(r, 400)))
const d = () => frame.contentDocument
const w = () => frame.contentWindow

const waitFor = (fn, ms = 8000) => new Promise((res, rej) => {
  const t0 = Date.now()
  const tick = () => {
    let v
    try { v = fn() } catch { v = false }
    if (v) return res(true)
    if (Date.now() - t0 > ms) return rej(new Error('timeout'))
    setTimeout(tick, 120)
  }
  tick()
})
const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

// 读出当前 hash 与标题，作为"视图是否真的切了"的判据
const state = () => ({
  hash: w().location.hash,
  title: d().querySelector('.page-title')?.textContent.trim() || '',
  crumb: d().querySelector('.page-crumb')?.textContent.trim() || ''
})

try {
  await frameLoaded
  await waitFor(() => d() && d().querySelector('.top-nav-item'))
  log('① 初始加载与 hash 归一化', 'h')

  const s0 = state()
  check('初始 hash 已归一化到默认视图', s0.hash === '#/analysis', s0.hash)
  check('首屏标题与路由一致', s0.title === '数据分析', s0.title)
  check('crumb 已渲染（此前从未显示）', s0.crumb.includes('/'), s0.crumb)

  log('② 点击导航切视图', 'h')
  /**
   * 像用户一样点击导航项。
   *
   * 不能只按文字找 `.top-nav-item`：桌面端导航已改为分层，
   * 使用教程 / 设置收在「更多」下拉里，窄宽度下法规速查也会被收进去。
   * 找不到就先展开「更多」再点——这正是用户的实际路径，
   * 也顺带把「被收起的项还能不能到达」变成一条真实断言。
   */
  const clickNav = async (label) => {
    const doc = d()
    let btn = [...doc.querySelectorAll('.top-nav-item')].find((b) => b.textContent.trim() === label)
    if (!btn) {
      const more = doc.querySelector('.top-nav-more')
      if (!more) throw new Error(`找不到导航项「${label}」，且页面上没有「更多」下拉`)
      more.click()
      await sleep(360)
      const menu = [...doc.querySelectorAll('.el-dropdown-menu__item')].find((el) => el.textContent.trim() === label)
      if (!menu) throw new Error(`「更多」下拉已展开，但里面没有「${label}」——该入口不可达`)
      btn = menu
    }
    btn.click()
    await sleep(300)
    return state()
  }

  const s1 = await clickNav('法规速查')
  check('点击后 hash 更新', s1.hash === '#/knowledge', s1.hash)
  check('点击后标题切换', s1.title === '法规速查', s1.title)
  check('点击后 crumb 切换', s1.crumb === '知识与协作 / 法规速查', s1.crumb)

  log('③ 浏览器后退 / 前进', 'h')
  /**
   * 为什么这里用父页面显式改 hash 来建立"上一条记录"，而不是只用点击导航：
   *
   * 实测发现，iframe **内部**由脚本改 hash（点导航走的就是这条路）在本机环境下
   * 不一定产生新的会话历史记录——history.length 会停在 1，于是 back() 无处可回。
   * 那会把"环境没给历史记录"误报成"路由坏了"。
   * 点击导航更新 hash 已由步骤 ② 覆盖；这一步只专注验证
   * 「浏览器前进/后退能不能切换视图」这一条硬要求本身。
   * 顶层文档（真实用户场景）的前进/后退另由 browser-probe.mjs 的
   * 「路由（真实浏览器前进后退）」一组断言独立覆盖，两边互为佐证。
   */
  w().location.hash = '#/documents'
  await waitFor(() => state().hash === '#/documents', 5000).catch(() => {})
  const lenBefore = w().history.length
  w().location.hash = '#/knowledge'
  await waitFor(() => state().hash === '#/knowledge', 5000).catch(() => {})
  const lenAfter = w().history.length
  check('切视图会产生新的历史记录（否则后退无从谈起）', lenAfter > lenBefore, `length ${lenBefore} → ${lenAfter}`)

  w().history.back()
  const backReached = await waitFor(() => state().hash === '#/documents', 8000).then(() => true).catch(() => false)
  const back = state()
  check('后退回到上一个视图', backReached && back.title === '底稿文书', `${back.hash}/${back.title}`)

  w().history.forward()
  const fwdReached = await waitFor(() => state().hash === '#/knowledge', 8000).then(() => true).catch(() => false)
  const fwd = state()
  check('前进回到下一个视图', fwdReached && fwd.title === '法规速查', `${fwd.hash}/${fwd.title}`)

  log('④ 直接改地址栏 hash（hashchange）', 'h')
  w().location.hash = '#/settings'
  await sleep(320)
  const manual = state()
  check('手改 hash 生效', manual.hash === '#/settings' && manual.title === '设置', `${manual.hash}/${manual.title}`)

  log('⑤ 非法 hash 不应清空界面', 'h')
  w().location.hash = '#/不存在的视图'
  await sleep(320)
  const bad = state()
  check('非法 hash 后仍停留在合法视图', bad.title === '设置', bad.title)

  log('⑥ inject("navigate") 兼容性', 'h')
  // ChatView / TutorialView 通过 inject('navigate') 切换，必须仍然可用
  const chatOk = await clickNav('AI 问答')
  check('可进入 AI 问答（inject 消费方所在页）', chatOk.hash === '#/chat', chatOk.hash)
  // 端到端校验 provide('navigate') / inject('navigate') 契约：
  // ChatView 的「去设置」按钮就是用注入来的 navigate 跳转的。
  // 点得动并真的切到设置，才说明契约还在——
  // （原来那句 `typeof x !== 'undefined' || true` 恒为真，等于没断言。）
  const goSettings = [...d().querySelectorAll('button')].find((b) => b.textContent.includes('去设置'))
  if (goSettings) {
    goSettings.click()
    const reached = await waitFor(() => state().hash === '#/settings', 6000).then(() => true).catch(() => false)
    const s6 = state()
    check('子组件通过 inject 的 navigate 能切换视图', reached && s6.title === '设置', `${s6.hash}/${s6.title}`)
  } else {
    check('子组件通过 inject 的 navigate 能切换视图', false, 'AI 问答页里找不到使用 navigate 的「去设置」按钮')
  }

  log('⑦ 刷新保持（重新加载同 hash）', 'h')
  const before = state()
  const reloadDone = new Promise((res) => {
    frame.addEventListener('load', res, { once: true })
  })
  frame.contentWindow.location.reload()
  await reloadDone
  await waitFor(() => d() && d().querySelector('.page-title'))
  const after = state()
  check('刷新后仍是同一视图', after.hash === before.hash && after.title === before.title, `${before.hash} -> ${after.hash}`)
  check('刷新后 crumb 仍在', after.crumb.length > 0, after.crumb)

  const passed = results.filter((r) => r.ok).length
  log('', 'h')
  log(`${passed}/${results.length} 个路由行为断言通过`, passed === results.length ? 'PASS' : 'FAIL')
  window.__routerAudit = { passed, total: results.length, results }
  document.title = passed === results.length ? 'ROUTER-OK' : 'ROUTER-FAIL'
} catch (error) {
  log(`运行失败：${error.message}`, 'FAIL')
  document.title = 'ROUTER-ERROR'
}
</script>
</body>
</html>
